name = "ant-crime-report-probe"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 12th of each month, 03:00 UTC = 09:00 Asia/Dhaka — the report is uploaded
# roughly 10 days after the month it covers ends (confirmed live: July
# 2026's was uploaded 2026-08-10), so this safely lands after that lag.
# Each expression maps to a handler in `CRON_JOBS` in src/index.js —
# adding one here without adding one there fires forever and does nothing.
[triggers]
crons = [
  # Monthly citywide crime figures from police.gov.bd (Module 4).
  "0 3 12 * *",
  # News-sourced per-thana advisories, twice daily (10:00 and 22:00 Dhaka).
  "0 4,16 * * *",
  # Social signals, every 6 hours — the corroboration window is 72h, so
  # there is nothing to gain from looking more often.
  "0 */6 * * *",
]
