name: Monthly crime report ingestion (retired — kept for reference)

# RETIRED 2026-09-03: tested live and GitHub Actions runners are refused a
# connection to police.gov.bd too (identical ECONNREFUSED to the same IP
# that blocked Google Cloud Functions from two regions — see
# functions/index.js's `recordCityTrendEntry` doc comment and task.md's
# Module 4 Round 5). The real automation now runs on Cloudflare Workers
# instead (cloudflare-worker/), confirmed live and reachable on the third
# try — a genuinely different network architecture (edge PoPs, not a
# datacenter VM), not just a different vendor. The schedule trigger below is
# removed so this doesn't send a failure email every month for a path
# that's confirmed not to work; `workflow_dispatch` is kept only in case
# GitHub's network access ever changes and it's worth re-testing by hand.
# Left in place as an honest record of what was tried, not deleted.
on:
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Run monthly ingestion
        working-directory: functions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/monthly_crime_ingest.js
